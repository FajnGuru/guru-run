<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#888}</style></head><body>
<script type="importmap">{"imports":{"three":"../assets/vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three'; import { buildSiki, animateSiki } from "../js/siki-model.js";
const q = new URLSearchParams(location.search), ang = { front: 0, side: -Math.PI / 2, side2: Math.PI / 2, back: Math.PI, q: -0.6 }[q.get('v') || 'front'];
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(380, 850); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x888888);
s.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 1.8); d.position.set(2, 4, 5); s.add(d);
const g = buildSiki(); g.root.rotation.y = ang; s.add(g.root);
const c = new THREE.OrthographicCamera(-1.12, 1.12, 2.5, -2.5, .1, 20); c.position.set(0, 1.95, 10); c.lookAt(0, 1.95, 0);
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(.05, clock.getDelta()), now = performance.now();
  animateSiki(g, { dt, now }, { driveRoot: true });
  r.render(s, c); requestAnimationFrame(loop);
}
document.title = 'done'; loop();
</script></body></html>
