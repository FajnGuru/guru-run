<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Guru Run: Celetná</title>
<style>body{margin:0;min-height:100dvh;background:#1b2a3a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;padding:16px;box-sizing:border-box}
img{height:min(70dvh,420px)}h1{color:#ffd24a;margin:0 0 20px}a{display:block;margin:12px 0;padding:16px 28px;border-radius:14px;background:#4f7a3a;color:#fff;text-decoration:none;font-size:22px;font-weight:bold;text-align:center}a.b{background:#7a4a26}
.gfx{margin-top:8px;text-align:center}.gfx-label{display:block;font-size:13px;opacity:.75;margin-bottom:8px;letter-spacing:.02em}
.gfx-row{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25)}
.gfx-row button{appearance:none;border:0;margin:0;padding:10px 18px;font:bold 15px sans-serif;color:rgba(255,255,255,.7);background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gfx-row button[aria-checked="true"]{background:#ffd24a;color:#1b2a3a}
.gfx-hint{display:block;margin-top:8px;font-size:12px;opacity:.55}</style></head>
<body><img src="assets/refs/guru-2.png" alt="Guru"><div><h1>GURU RUN<br><small>Celetná</small></h1><a href="3d/">▶ 3D verze (nová)</a><a class="b" href="2d/">▶ 2D plošinovka</a>
<div class="gfx" role="radiogroup" aria-label="Nastavení grafiky">
<span class="gfx-label">Nastavení 3D</span>
<div class="gfx-row">
<button type="button" role="radio" data-gfx="quality" aria-checked="true" id="gfx-quality">Grafika</button>
<button type="button" role="radio" data-gfx="perf" aria-checked="false" id="gfx-perf">Výkon</button>
</div>
<small class="gfx-hint">Výkon = nižší rozlišení a stíny (mobil)</small>
</div></div>
<script>
(function () {
  var KEY = 'guru-run-gfx';
  function read() {
    try { return localStorage.getItem(KEY) === 'perf' ? 'perf' : 'quality'; } catch (e) { return 'quality'; }
  }
  function sync(mode) {
    document.querySelectorAll('.gfx-row [role=radio]').forEach(function (btn) {
      var on = btn.getAttribute('data-gfx') === mode;
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  function set(mode) {
    mode = mode === 'perf' ? 'perf' : 'quality';
    try { localStorage.setItem(KEY, mode); } catch (e) {}
    sync(mode);
  }
  sync(read());
  document.querySelectorAll('.gfx-row [role=radio]').forEach(function (btn) {
    btn.addEventListener('click', function () { set(btn.getAttribute('data-gfx')); });
  });
})();
</script></body></html>
